[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "voicestream"
version = "0.2.0"
description = "Always-on meeting voice stream: captures mic + system audio, transcribes live, extracts action items with Claude, pushes them to your tools, and dispatches agents to do the work while you're still in the meeting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "httpx>=0.27",
  "anthropic>=0.70",
  "websockets>=14",
  "tzdata; sys_platform == 'win32'",  # zoneinfo has no system database on Windows
]

[project.optional-dependencies]
# Live capture: microphone (all OSes) + system audio (WASAPI/PulseAudio loopback,
# macOS 14.2+ Core Audio tap). Linux also needs PortAudio: apt install libportaudio2.
audio = [
  "sounddevice>=0.5.6",
  "SoundCard>=0.4.6; sys_platform != 'darwin'",
  "catap>=0.6; sys_platform == 'darwin'",
]
# Optional WebRTC VAD (vad.engine = "webrtc"); the original webrtcvad breaks on setuptools>=82.
vad = ["webrtcvad-wheels>=2.0.14"]
# Free, offline transcription.
local = ["faster-whisper>=1.0"]
# Periodic screenshots of what's being shared.
screen = ["mss>=10.2", "pillow>=10.0"]
# Live web dashboard (transcript, action items, approve/run buttons).
dashboard = ["starlette>=0.37", "uvicorn>=0.29"]
# Agents that actually do tasks mid-meeting.
agents = ["claude-agent-sdk>=0.2.167"]
# The Mac app's window and menu-bar icon (`voicestream app`). Pinned: the shell reaches into
# pywebview's Cocoa backend (voicestream/app/native.py). Installs nothing on other systems.
mac = [
  "pywebview==6.2.1; sys_platform == 'darwin'",
  "pyobjc-core==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-WebKit==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-AVFoundation==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-ServiceManagement==12.2.2; sys_platform == 'darwin'",
  "pyobjc-framework-CoreAudio==12.2.2; sys_platform == 'darwin'",
  "keyring>=25.7; sys_platform == 'darwin'",
]
# The app's backend (`voicestream app`): settings written from the UI with your comments kept
# (tomlkit), API keys in the macOS Keychain (keyring; elsewhere ~/.voicestream/.env).
app = ["voicestream[dashboard]", "tomlkit>=0.13.2", "keyring>=25.5"]
all = ["voicestream[audio,local,screen,dashboard,agents,mac,app]"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "starlette>=0.37", "uvicorn>=0.29", "pillow>=10.0", "tomlkit>=0.13.2", "keyring>=25.5"]

[project.scripts]
voicestream = "voicestream.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voicestream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
